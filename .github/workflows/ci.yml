name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run that is still going. Runs on main
# are never cancelled: a run that is already publishing or deploying must finish, and a newer one waits.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only by default. Only the docker job below is given more, and only to publish the image.
permissions:
  contents: read

env:
  # Elixir and OTP come from .tool-versions and Node from .nvmrc (the same files mise and nvm read on
  # your Mac). Typst has no such file, so its version lives here and in the Dockerfile; the
  # "Check pinned versions agree" step fails if the two drift apart.
  TYPST_VERSION: "0.15.1"
  # SHA-256 of typst-x86_64-unknown-linux-musl.tar.xz for the version above (from the GitHub release).
  TYPST_SHA256: "a6d077d0a95eed5a2eba715b2dae06be954f624ccbf85758a03f389ded33118c"

jobs:
  test:
    name: Format, compile, test, assets
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    env:
      MIX_ENV: test

    # Matches config/test.exs: user and password "postgres", host localhost.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v7

      # Cheap and fast, so it runs first. The same versions appear in .tool-versions, the Dockerfile and
      # this file; without this check one of them gets bumped and the others are forgotten.
      - name: Check pinned versions agree
        run: |
          fail=0
          tool() { awk -v t="$1" '$1 == t { print $2 }' .tool-versions; }
          arg() { sed -n "s/^ARG $1=//p" Dockerfile | head -n 1; }
          check() { # name, expected, actual
            if [ "$2" = "$3" ]; then echo "ok   $1 = $3"; else echo "FAIL $1: $2 vs $3"; fail=1; fi
          }
          elixir_full="$(tool elixir)"
          check "Elixir (.tool-versions vs Dockerfile)" "${elixir_full%-otp-*}" "$(arg ELIXIR_VERSION)"
          check "OTP (.tool-versions vs Dockerfile)" "$(tool erlang)" "$(arg OTP_VERSION)"
          check "OTP major (erlang vs elixir -otp- suffix)" "$(tool erlang | cut -d. -f1)" "${elixir_full##*-otp-}"
          check "Typst version (ci.yml vs Dockerfile)" "$TYPST_VERSION" "$(arg TYPST_VERSION)"
          check "Typst amd64 SHA-256 (ci.yml vs Dockerfile)" "$TYPST_SHA256" "$(arg TYPST_SHA256_AMD64)"
          exit "$fail"

      - uses: erlef/setup-beam@v1
        with:
          version-file: .tool-versions
          version-type: strict

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: assets/package-lock.json

      - name: Cache Mix dependencies and build
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-${{ hashFiles('mix.lock') }}
          restore-keys: |
            mix-${{ runner.os }}-${{ hashFiles('.tool-versions') }}-

      # The renderer and generate tests (tagged :typst) compile real PDFs, so the binary must exist.
      - name: Install Typst (same version as the Docker image)
        run: |
          curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o "$RUNNER_TEMP/typst.tar.xz"
          echo "${TYPST_SHA256}  $RUNNER_TEMP/typst.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          sudo install -m 0755 "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl/typst" /usr/local/bin/typst
          typst --version

      - name: Install npm packages
        run: npm ci --prefix assets

      - name: Install Mix dependencies
        run: mix deps.get

      # `mix precommit` rewrites files; CI only checks, so a forgotten format fails the run.
      - name: Check formatting
        run: mix format --check-formatted

      - name: Check for unused dependencies in mix.lock
        run: mix deps.unlock --check-unused

      - name: Compile (warnings are errors)
        run: mix compile --warnings-as-errors

      # The test alias creates and migrates the database first.
      - name: Run tests
        run: mix test --warnings-as-errors

      # Same two steps as the Docker build, so a broken Tailwind @source or JS import shows up here.
      # `!cancelled()` runs it even when the tests failed, so you see both problems at once.
      - name: Build assets
        if: ${{ !cancelled() }}
        run: |
          mix assets.setup
          mix assets.deploy

  # The one and only build of the production image. Pull requests build it to prove the Dockerfile
  # works; a push to main also publishes it to GitHub's container registry, and Dokploy pulls it from
  # there (see the deploy job). Dokploy never builds anything.
  docker:
    name: Docker image builds
    needs: test
    # The Dokploy server is arm64, so the image is built for arm64, natively and without QEMU. The arm64
    # runner is free because the repository is public. The Dockerfile also supports amd64.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write

    env:
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` (what Dokploy runs) and `sha-<commit>` (to roll back to a known build).
      # It also sets the labels that link the image to this repository.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      # `provenance: false` keeps the registry free of the extra "unknown/unknown" attestation entries
      # that a single-platform image would otherwise get on every build.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Tells Dokploy to deploy: it pulls `latest` (the image pushed above) and restarts the application.
  # Only runs for pushes to main, after the tests passed and the image was published.
  #
  # The Dokploy panel is only reachable over Tailscale (its public domain sits behind Cloudflare,
  # which challenges automated requests), so the runner first joins the tailnet as a temporary node
  # tagged tag:ci, then calls the panel's tailnet address. Same setup as the mangogst repository.
  # This repository is public, so its logs are too: nothing below prints the panel's address.
  deploy:
    name: Deploy to Dokploy
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    # Needs no access to the repository or its packages: it only calls Dokploy.
    permissions: {}

    # One deploy at a time; a newer one waits instead of cancelling a deployment that is running.
    concurrency:
      group: deploy-production
      cancel-in-progress: false

    steps:
      # Until the four secrets exist, the job reports "Skipped" and the run stays green.
      - name: Check that deploying is set up
        id: setup
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          if [ -n "$TS_AUTHKEY" ] && [ -n "$DOKPLOY_URL" ] && [ -n "$DOKPLOY_API_KEY" ] && [ -n "$DOKPLOY_APP_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipped. Add the TS_AUTHKEY, DOKPLOY_URL, DOKPLOY_API_KEY and DOKPLOY_APP_ID secrets to deploy."
          fi

      # TS_AUTHKEY: an ephemeral, reusable auth key with tag:ci. Auth keys expire after at most 90
      # days; an OAuth client does not (use `oauth-client-id`, `oauth-secret` and `tags: tag:ci` instead).
      - name: Connect to Tailscale
        if: steps.setup.outputs.ready == 'true'
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}

      # DOKPLOY_URL is the panel's tailnet address with its port, for example
      # http://<machine>.<tailnet>.ts.net:3000 (plain http is fine inside a tailnet).
      - name: Ask Dokploy to deploy
        if: steps.setup.outputs.ready == 'true'
        env:
          DOKPLOY_URL: ${{ secrets.DOKPLOY_URL }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          DOKPLOY_APP_ID: ${{ secrets.DOKPLOY_APP_ID }}
        run: |
          # Pasted secrets often carry a stray newline or space.
          url="$(printf '%s' "$DOKPLOY_URL" | tr -d '[:space:]')"
          key="$(printf '%s' "$DOKPLOY_API_KEY" | tr -d '[:space:]')"
          id="$(printf '%s' "$DOKPLOY_APP_ID" | tr -d '[:space:]')"
          body="$(jq -n --arg id "$id" --arg title "GitHub Actions ${GITHUB_SHA::7}" \
            '{applicationId: $id, title: $title}')"

          # curl's own error messages contain the host name, so its stderr is dropped.
          rc=0
          code="$(curl --silent --max-time 60 --output "$RUNNER_TEMP/dokploy.json" \
            --write-out '%{http_code}' \
            --request POST "${url%/}/api/application.deploy" \
            --header "x-api-key: $key" \
            --header "Content-Type: application/json" \
            --data "$body" 2>/dev/null)" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::Could not reach Dokploy (curl exit $rc). Is the runner on the tailnet, and is the address in DOKPLOY_URL right?"
            exit 1
          fi

          echo "Dokploy answered HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            head -c 500 "$RUNNER_TEMP/dokploy.json"; echo
            exit 1
          fi
